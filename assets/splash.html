<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRIS - Cargando</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: transparent;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: visible;
      backdrop-filter: blur(8px);
    }
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 30px;
      overflow: visible;
      animation: 
        breathe 3s ease-in-out infinite,
        spin-slow 3s linear infinite;
    }
    .logo svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 30px rgba(103, 58, 183, 0.8)) 
              drop-shadow(0 0 60px rgba(0, 188, 212, 0.5));
    }
    @keyframes breathe {
      0%, 100% { 
        transform: scale(1);
        filter: drop-shadow(0 0 30px rgba(103, 58, 183, 0.8)) 
                drop-shadow(0 0 60px rgba(0, 188, 212, 0.5));
      }
      50% { 
        transform: scale(1.08);
        filter: drop-shadow(0 0 50px rgba(103, 58, 183, 1)) 
                drop-shadow(0 0 100px rgba(0, 188, 212, 0.8));
      }
    }
    @keyframes spin-slow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .title {
      color: white;
      font-size: 48px;
      font-weight: 300;
      letter-spacing: 12px;
      margin-bottom: 8px;
      opacity: 0;
      filter: blur(10px);
      animation: appear 1s ease-out forwards;
      animation-delay: 1s;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
      user-select: none;
    }
    .subtitle {
      color: rgba(255, 255, 255, 0.7);
      font-size: 16px;
      font-weight: 300;
      letter-spacing: 4px;
      opacity: 0;
      filter: blur(10px);
      animation: appear 1s ease-out forwards;
      animation-delay: 2s;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
      user-select: none;
    }
    @keyframes appear {
      to {
        opacity: 1;
        filter: blur(0);
      }
    }
  </style>
</head>
<body>
  <div class="logo">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <mask id="ringMask">
          <circle cx="50" cy="50" r="45" fill="none" stroke="white" stroke-width="5.5" />
        </mask>
      </defs>
      <g mask="url(#ringMask)">
        <foreignObject x="0" y="0" width="100" height="100">
          <div xmlns="http://www.w3.org/1999/xhtml" 
               style="width: 100%; height: 100%; border-radius: 50%; 
                      background: conic-gradient(from 200deg, #673AB7, #3F51B5, #00BCD4, #4CAF50, #FFC107, #FF9800, #9C27B0, #673AB7);">
          </div>
        </foreignObject>
      </g>
    </svg>
  </div>
  <div class="title">IRIS</div>
  <div class="subtitle">Insightful Restaurant Intelligence System</div>
</body>
</html>
